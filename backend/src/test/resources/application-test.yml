# 测试环境配置
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

app:
  graph:
    seed-path: disabled
  cors:
    allowed-origins: http://localhost:5173
  bootstrap:
    graph-import-path:
  security:
    admin:
      username: admin
      password: admin123
    jwt:
      secret: test-secret-key-for-unit-testing-32chars
      expiration-minutes: 15
      refresh-expiration-minutes: 60
  routing:
    max-snap-meters: 5000
    use-postgis-knn: false
  campus:
    bbox: 23.2732730,113.1995461,23.2766018,113.2050374

file:
  upload:
    dir: ./test-uploads
    url-prefix: /uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info
