# Production profile: safer defaults.
#
# Enable via:
#   SPRING_PROFILES_ACTIVE=prod
#
# Notes:
# - Tighten actuator access (Prometheus scrape should be protected by network policy / auth in prod).
# - Hide health details.

app:
  security:
    actuator:
      prometheus-public: false
    rate-limit:
      enabled: true
      use-redis: true
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
