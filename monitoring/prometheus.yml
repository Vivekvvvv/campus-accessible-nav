# Prometheus config (scrape + alerts)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot backend
  - job_name: 'accessible-nav-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\\d+'
        replacement: '${1}'

  # Host/container metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  # Optional infra (enable only if you deploy corresponding exporters)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['localhost:9121']
