global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Control-plane binding: SLO/navigation alerts trigger action webhook first.
    - match_re:
        alertname: 'SLOAvailabilityFastBurn|SLOHttp5xxFastBurn|SLORouteP95FastBurn|NavigationObstacleRerouteSpike|NavigationHazardQueriesHighPerSession|NavigationOffRouteWarnRatioHigh'
      receiver: 'control-plane-actions'
      continue: true
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-critical@example.com'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true

  # Action webhook receiver:
  # - Recommended implementation: lightweight service that receives Alertmanager payload
  #   and invokes scripts/cd/handle-alert-actions.sh.
  - name: 'control-plane-actions'
    webhook_configs:
      - url: 'http://localhost:19093/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
